# Loki — SimpleScalable mode with S3 backend.
# Chunks + index land in S3; no local persistence beyond WAL.

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: alp-${ENV}-loki-chunks
      ruler:  alp-${ENV}-loki-ruler
      admin:  alp-${ENV}-loki-admin
    s3:
      region: ap-south-1
      # IRSA — role ARN injected via ServiceAccount annotation in Helm chart.
  limits_config:
    retention_period: 744h    # 31 days
    max_query_series: 10000
    max_query_parallelism: 32
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40

# Deployment mode
deploymentMode: SimpleScalable
backend:
  replicas: 3
read:
  replicas: 3
write:
  replicas: 3

gateway:
  enabled: true
  replicas: 2
