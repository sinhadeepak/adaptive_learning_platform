name: alp-local

# Local dev stack — see docs/02_planning/08_DevEnvironmentRequirements_AdaptiveLearningPlatform.md
# Default profile launches infra + all 9 backend services + 3 web apps in containers.
# Use `--profile host` for the older host-binary mode (debugger-friendly).

x-py-build: &py-build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.python

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth,user_profile,content,catalog,search,analytics,payment,institution,notification,adaptive_engine,quiz
    ports: ["35432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["36379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - cluster.name=alp-local
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["39200:9200"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "34222:4222"
      - "38222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,secretsmanager,sqs,sns
      DEBUG: 0
      AWS_DEFAULT_REGION: ap-south-1
    ports: ["34566:4566"]
    volumes:
      - localstack-data:/var/lib/localstack

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "31025:1025"  # SMTP
      - "38025:8025"  # Web UI

  # ---- Backend services (Python) ----
  auth:
    build:
      <<: *py-build
      args: { SERVICE: auth, MODULE: auth.main }
    image: alp/auth:local
    ports: ["38001:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/auth
      AUTH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/auth
      AUTH_REDIS_URL: redis://redis:6379/0
      AUTH_NATS_URL: nats://nats:4222
      AUTH_INSTITUTION_BASE_URL: http://institution:8000
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: "1025"
      # Local-only seed: enables migration 004 to insert four known test
      # accounts (student@/teacher@/moderator@/admin@alp.dev, password
      # `Password123!`). Absent in staging/prod.
      AUTH_SEED_LOCAL: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

  user-profile:
    build:
      <<: *py-build
      args: { SERVICE: user-profile, MODULE: user_profile.main }
    image: alp/user-profile:local
    ports: ["38002:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/user_profile
      USER_PROFILE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/user_profile
      USER_PROFILE_NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  catalog:
    build:
      <<: *py-build
      args: { SERVICE: catalog, MODULE: catalog.main }
    image: alp/catalog:local
    ports: ["38004:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/catalog
      CATALOG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/catalog
      CATALOG_NATS_URL: nats://nats:4222
      CATALOG_INSTITUTION_BASE_URL: http://institution:8000
      # Must match auth's JWT_SECRET so tokens issued by Auth verify on
      # the educator-scoped endpoints (/catalog/educators/me/*).
      CATALOG_JWT_SECRET: dev-only-change-me-in-staging-at-least-32-bytes-long
      # Local-only seed: enables migration 006 to insert assignments
      # for teacher@/moderator@alp.dev against every published exam so
      # the cascading dropdown on /questions/new works on a fresh stack.
      CATALOG_SEED_LOCAL: "1"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  content:
    build:
      <<: *py-build
      args: { SERVICE: content, MODULE: content.main }
    image: alp/content:local
    ports: ["38003:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/content
      CONTENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/content
      CONTENT_NATS_URL: nats://nats:4222
      # Must match auth's JWT_SECRET so tokens issued by Auth verify here.
      CONTENT_JWT_SECRET: dev-only-change-me-in-staging-at-least-32-bytes-long
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  search:
    build:
      <<: *py-build
      args: { SERVICE: search, MODULE: search.main }
    image: alp/search:local
    ports: ["38005:8000"]
    environment:
      SEARCH_OPENSEARCH_URL: http://opensearch:9200
      SEARCH_TOPICS_INDEX: topics_v2
      SEARCH_NATS_URL: nats://nats:4222
      SEARCH_CATALOG_BASE_URL: http://catalog:8000/catalog
    depends_on:
      opensearch: { condition: service_healthy }
      nats: { condition: service_healthy }
      catalog: { condition: service_started }

  analytics:
    build:
      <<: *py-build
      args: { SERVICE: analytics, MODULE: analytics.main }
    image: alp/analytics:local
    ports: ["38006:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/analytics
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/analytics
      ANALYTICS_NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  payment:
    build:
      <<: *py-build
      args: { SERVICE: payment, MODULE: payment.main }
    image: alp/payment:local
    ports: ["38007:8000"]
    environment:
      PAYMENT_NATS_URL: nats://nats:4222
      PAYMENT_INSTITUTION_BASE_URL: http://institution:8000
    depends_on:
      nats: { condition: service_healthy }

  institution:
    build:
      <<: *py-build
      args: { SERVICE: institution, MODULE: institution.main }
    image: alp/institution:local
    ports: ["38008:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/institution
      INSTITUTION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/institution
      INSTITUTION_NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  notification:
    build:
      <<: *py-build
      args: { SERVICE: notification, MODULE: notification.main }
    image: alp/notification:local
    ports: ["38009:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/notification
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/notification
      NOTIFICATION_NATS_URL: nats://nats:4222
      NOTIFICATION_INSTITUTION_BASE_URL: http://institution:8000
      # SMTP outbound — Mailpit container in local dev (port 1025, no auth).
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: "1025"
      # Service-to-service profile lookup for the "to:" email.
      NOTIFICATION_PROFILE_INTERNAL_BASE_URL: http://user-profile:8000
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      mailpit: { condition: service_started }
      user-profile: { condition: service_started }

  adaptive-engine:
    build:
      <<: *py-build
      args: { SERVICE: adaptive-engine, MODULE: adaptive_engine.main }
    image: alp/adaptive-engine:local
    ports: ["38010:8000"]
    environment:
      ADAPTIVE_ENGINE_NATS_URL: nats://nats:4222
      ADAPTIVE_ENGINE_INSTITUTION_BASE_URL: http://institution:8000
    depends_on:
      nats: { condition: service_healthy }

  # ---- Backend services (Go) ----
  quiz:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.golang
      args: { SERVICE: quiz }
    image: alp/quiz:local
    ports: ["38011:8000"]
    environment:
      QUIZ_DATABASE_URL: postgres://postgres:postgres@postgres:5432/quiz?sslmode=disable
      QUIZ_NATS_URL: nats://nats:4222
      QUIZ_INSTITUTION_BASE_URL: http://institution:8000
      QUIZ_ADAPTIVE_BASE_URL: http://adaptive-engine:8000
      QUIZ_MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  # ---- Web apps ----
  web-student:
    build:
      context: ../..
      dockerfile: apps/web-student/Dockerfile
    image: alp/web-student:local
    ports: ["35173:8080"]
    depends_on:
      auth: { condition: service_started }
      catalog: { condition: service_started }
      quiz: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-portal:
    build:
      context: ../..
      dockerfile: apps/web-portal/Dockerfile
    image: alp/web-portal:local
    ports: ["35174:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-admin:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
    image: alp/web-admin:local
    ports: ["35175:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg-data:
  redis-data:
  opensearch-data:
  nats-data:
  localstack-data:
