name: alp-local

# Local dev stack — see docs/02_planning/08_DevEnvironmentRequirements_AdaptiveLearningPlatform.md
# Services (auth, quiz, etc.) run on the host for debugger + iteration speed;
# only infrastructure runs in containers here.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth,user_profile,content,catalog,search,analytics,payment,institution,notification,adaptive_engine,quiz
    ports: ["35432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["36379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - cluster.name=alp-local
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["39200:9200"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "34222:4222"
      - "38222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,secretsmanager,sqs,sns
      DEBUG: 0
      AWS_DEFAULT_REGION: ap-south-1
    ports: ["34566:4566"]
    volumes:
      - localstack-data:/var/lib/localstack

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "31025:1025"  # SMTP
      - "38025:8025"  # Web UI

  # ---- Web apps (optional — `--profile frontend` to include) ----
  # Default dev path is `pnpm dev` on host for hot reload + debugger speed.
  # These services are primarily for CI smoke tests and prod-like local verification.
  # Build context is the monorepo root so the pnpm workspace resolves @alp/design-system.
  web-student:
    profiles: ["frontend", "all"]
    build:
      context: ../..
      dockerfile: apps/web-student/Dockerfile
    image: alp/web-student:local
    ports: ["35173:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-portal:
    profiles: ["frontend", "all"]
    build:
      context: ../..
      dockerfile: apps/web-portal/Dockerfile
    image: alp/web-portal:local
    ports: ["35174:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-admin:
    profiles: ["frontend", "all"]
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
    image: alp/web-admin:local
    ports: ["35175:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg-data:
  redis-data:
  opensearch-data:
  nats-data:
  localstack-data:
