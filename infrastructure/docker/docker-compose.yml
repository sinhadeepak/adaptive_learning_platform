name: alp-local

# Local dev stack — see docs/02_planning/08_DevEnvironmentRequirements_AdaptiveLearningPlatform.md
# Per ADR-0005, default profile launches infra + the 5 consolidated backend
# services (identity, payment, learning, quiz, engagement) + 3 web apps.
# Use `--profile host` for the older host-binary mode (debugger-friendly).

x-py-build: &py-build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.python

services:
  postgres:
    # pgvector/pgvector:pg15 = stock PostgreSQL 15 + the `vector` extension,
    # required by the AI Content Guardrail L3 similarity scan (migration 040
    # runs CREATE EXTENSION vector). Drop-in for postgres:15 (same PG major,
    # so the on-disk data format is compatible). NOTE: this image is Debian-
    # based where the old image was Alpine (musl→glibc); on an existing
    # pg-data volume Postgres may log a one-time collation-version warning.
    # If text-index issues appear, REINDEX or recreate the volume (dev-reset).
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: identity,learning,engagement,payment,quiz,marketplace,battle
    ports: ["35432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["36379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - cluster.name=alp-local
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["39200:9200"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "34222:4222"
      - "38222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,secretsmanager,sqs,sns
      DEBUG: 0
      AWS_DEFAULT_REGION: ap-south-1
    ports: ["34566:4566"]
    volumes:
      - localstack-data:/var/lib/localstack

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "31025:1025"  # SMTP
      - "38025:8025"  # Web UI

  # ---- Object storage ----
  # MinIO is the dev-time S3 we sign uploads against (case-study
  # response files, doubt-photos, content media, etc). Browsers PUT
  # directly to localhost:39000 via presigned URLs the backend signs;
  # backend services talk to it via the in-network `minio:9000`. The
  # init container bootstraps the buckets + folder layout described
  # in docs/storage_layout.md so every service writes to the same
  # well-known prefixes.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-root-password-change-me
      # CORS: dev only — wide-open so the SPA at any localhost port can
      # PUT directly to the presigned URL. Staging/prod tighten this to
      # the deployed origin via Helm values.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "39000:9000"  # S3 API (browser presigned PUTs hit this)
      - "39001:9001"  # Console UI
    volumes:
      - minio-data:/data
    healthcheck:
      # `/minio/health/live` is MinIO's built-in liveness probe; no auth
      # needed and faster than spinning up `mc`. curl is on every minio
      # image since RELEASE.2024-x.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # One-shot bucket bootstrap. Creates the `alp-uploads` bucket plus
  # an `alp-app` IAM user the backend services use to sign URLs (least
  # privilege — no admin access). Idempotent; safe to re-run.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minio-root minio-root-password-change-me;
      mc mb --ignore-existing local/alp-uploads;
      mc anonymous set none local/alp-uploads;
      mc admin user add local alp-app alp-app-password-change-me 2>/dev/null || true;
      mc admin policy attach local readwrite --user=alp-app 2>/dev/null || true;
      echo '✓ minio bootstrap complete: bucket=alp-uploads user=alp-app';
      "

  # ---- Backend services (Python) — consolidated per ADR-0005 ----
  identity:
    build:
      <<: *py-build
      args: { SERVICE: identity, MODULE: identity.main }
    image: alp/identity:local
    ports: ["38001:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/identity
      # Auth — keeps AUTH_* env_prefix per the legacy module's config.
      AUTH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/identity
      AUTH_REDIS_URL: redis://redis:6379/0
      AUTH_NATS_URL: nats://nats:4222
      AUTH_INSTITUTION_BASE_URL: http://identity:8000
      AUTH_PAYMENT_BASE_URL: http://payment:8000
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: "1025"
      AUTH_SEED_LOCAL: "1"
      # Profile (renamed from user_profile)
      USER_PROFILE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/identity
      USER_PROFILE_NATS_URL: nats://nats:4222
      # Institution
      INSTITUTION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/identity
      INSTITUTION_NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_healthy }

  learning:
    build:
      <<: *py-build
      args: { SERVICE: learning, MODULE: learning.main, INSTALL_CLAUDE_CODE: "1" }
    image: alp/learning:local
    ports: ["38101:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/learning
      # Catalog
      CATALOG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/learning
      CATALOG_NATS_URL: nats://nats:4222
      CATALOG_INSTITUTION_BASE_URL: http://identity:8000
      CATALOG_JWT_SECRET: dev-only-change-me-in-staging-at-least-32-bytes-long
      CATALOG_SEED_LOCAL: "1"
      # Content
      CONTENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/learning
      CONTENT_NATS_URL: nats://nats:4222
      CONTENT_JWT_SECRET: dev-only-change-me-in-staging-at-least-32-bytes-long
      CONTENT_CATALOG_BASE_URL: http://learning:8000
      CONTENT_SEED_LOCAL: "1"
      # Doubts
      DOUBTS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/learning
      DOUBTS_JWT_SECRET: dev-only-change-me-in-staging-at-least-32-bytes-long
      # Search
      SEARCH_OPENSEARCH_URL: http://opensearch:9200
      SEARCH_TOPICS_INDEX: topics_v2
      SEARCH_NATS_URL: nats://nats:4222
      SEARCH_CATALOG_BASE_URL: http://learning:8000/catalog
      # Adaptive (renamed from adaptive-engine)
      ADAPTIVE_ENGINE_NATS_URL: nats://nats:4222
      ADAPTIVE_ENGINE_INSTITUTION_BASE_URL: http://identity:8000
      ADAPTIVE_ENGINE_CATALOG_BASE_URL: http://learning:8000
      ADAPTIVE_ENGINE_ANALYTICS_BASE_URL: http://engagement:8000
      ADAPTIVE_ENGINE_QUIZ_BASE_URL: http://quiz:8000
      ADAPTIVE_ENGINE_REDIS_URL: redis://redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADAPTIVE_ENGINE_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # R-S1 — Content references (YouTube curation). Empty in dev;
      # the search endpoint degrades to a "paste-URL" hint until set.
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      REDIS_URL: redis://redis:6379/4
      # ── Object storage (MinIO in dev, S3 in staging/prod) ──
      # `MINIO_*` for the app→server connection (in-network).
      # `MINIO_PUBLIC_ENDPOINT` is the URL the *browser* will see in
      # presigned PUT URLs — must be reachable from the user's
      # machine, not just from inside docker.
      UPLOADS_BUCKET: alp-uploads
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:39000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: alp-app
      MINIO_SECRET_KEY: alp-app-password-change-me
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      nats: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }
    volumes:
      - claude-cli-creds:/home/app/.claude

  engagement:
    build:
      <<: *py-build
      args: { SERVICE: engagement, MODULE: engagement.main }
    image: alp/engagement:local
    ports: ["38100:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/engagement
      # Analytics
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/engagement
      ANALYTICS_NATS_URL: nats://nats:4222
      ANALYTICS_QUIZ_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/quiz
      # Analytics needs to reach Institution (cohort membership lookup
      # for the class-leaderboard endpoint, AP-01 HTTP join) and Learning
      # (syllabus tree + question_concepts fan-out for multi-parameter
      # mastery, S37.5 + S39). Without these, the analytics module falls
      # back to the defaults (http://institution:8000, http://learning:8000)
      # — `institution` doesn't resolve and the leaderboard silently
      # returns an empty list.
      ANALYTICS_INSTITUTION_BASE_URL: http://identity:8000
      ANALYTICS_LEARNING_BASE_URL: http://learning:8000
      # Notification
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/engagement
      NOTIFICATION_NATS_URL: nats://nats:4222
      NOTIFICATION_INSTITUTION_BASE_URL: http://identity:8000
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: "1025"
      NOTIFICATION_PROFILE_INTERNAL_BASE_URL: http://identity:8000
      NOTIFICATION_QUIZ_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/quiz
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      mailpit: { condition: service_started }
      identity: { condition: service_started }

  payment:
    build:
      <<: *py-build
      args: { SERVICE: payment, MODULE: payment.main }
    image: alp/payment:local
    ports: ["38007:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/payment
      PAYMENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/payment
      PAYMENT_NATS_URL: nats://nats:4222
      PAYMENT_INSTITUTION_BASE_URL: http://identity:8000
      # Stripe — set these via .env in real environments. Empty → stub mode
      # (Sprint 8: lets the full flow be exercised without a Stripe account).
      PAYMENT_STRIPE_API_KEY: "${PAYMENT_STRIPE_API_KEY:-}"
      PAYMENT_STRIPE_WEBHOOK_SECRET: "${PAYMENT_STRIPE_WEBHOOK_SECRET:-}"
      PAYMENT_STRIPE_PRICE_ID_PREMIUM_MONTHLY: "${PAYMENT_STRIPE_PRICE_ID_PREMIUM_MONTHLY:-price_test_premium_monthly}"
      PAYMENT_STRIPE_PRICE_ID_PREMIUM_YEARLY: "${PAYMENT_STRIPE_PRICE_ID_PREMIUM_YEARLY:-price_test_premium_yearly}"
      PAYMENT_CHECKOUT_SUCCESS_URL: "${PAYMENT_CHECKOUT_SUCCESS_URL:-http://localhost:35173/billing?status=success&session_id={CHECKOUT_SESSION_ID}}"
      PAYMENT_CHECKOUT_CANCEL_URL: "${PAYMENT_CHECKOUT_CANCEL_URL:-http://localhost:35173/billing?status=cancel}"
      PAYMENT_JWT_SECRET: "${JWT_SECRET:-dev-only-change-me-in-staging-at-least-32-bytes-long}"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  marketplace:
    build:
      <<: *py-build
      args: { SERVICE: marketplace, MODULE: marketplace.main }
    image: alp/marketplace:local
    ports: ["38110:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/marketplace
      MARKETPLACE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/marketplace
      MARKETPLACE_NATS_URL: nats://nats:4222
      MARKETPLACE_IDENTITY_BASE_URL: http://identity:8000
      MARKETPLACE_PAYMENT_BASE_URL: http://payment:8000
      MARKETPLACE_SEED_LOCAL: "1"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  # ---- Backend services (Go) ----
  quiz:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.golang
      args: { SERVICE: quiz }
    image: alp/quiz:local
    ports: ["38011:8000"]
    environment:
      QUIZ_DATABASE_URL: postgres://postgres:postgres@postgres:5432/quiz?sslmode=disable
      QUIZ_NATS_URL: nats://nats:4222
      QUIZ_INSTITUTION_BASE_URL: http://identity:8000
      QUIZ_ADAPTIVE_BASE_URL: http://learning:8000
      QUIZ_CONTENT_BASE_URL: http://learning:8000
      QUIZ_MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }

  # F7 (ADR-0027) — real-time battle service. WebSocket gateway +
  # matchmaker. Uses the same shared JWT secret as identity so the
  # bearer token from a logged-in student verifies here without a
  # round-trip back to identity.
  battle:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.golang
      args: { SERVICE: battle }
    image: alp/battle:local
    ports: ["38012:8000"]
    environment:
      BATTLE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/battle?sslmode=disable
      BATTLE_JWT_SECRET: dev-only-change-me-in-staging-at-least-32-bytes-long
      BATTLE_LEARNING_BASE_URL: http://learning:8000
      BATTLE_QUIZ_BASE_URL: http://quiz:8000
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Web apps ----
  web-student:
    build:
      context: ../..
      dockerfile: apps/web-student/Dockerfile
    image: alp/web-student:local
    ports: ["35173:8080"]
    depends_on:
      identity: { condition: service_started }
      learning: { condition: service_started }
      quiz: { condition: service_started }
      engagement: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-portal:
    build:
      context: ../..
      dockerfile: apps/web-portal/Dockerfile
    image: alp/web-portal:local
    ports: ["35174:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-admin:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
    image: alp/web-admin:local
    ports: ["35175:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg-data:
  redis-data:
  opensearch-data:
  nats-data:
  localstack-data:
  minio-data:
  claude-cli-creds:
