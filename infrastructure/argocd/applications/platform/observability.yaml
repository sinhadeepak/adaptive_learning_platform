# ApplicationSet fans out observability — kube-prometheus-stack, Loki, Tempo.
# Values files live under infrastructure/observability/.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - { name: kube-prometheus-stack, chart: kube-prometheus-stack, repo: "https://prometheus-community.github.io/helm-charts", version: "65.x",  valuesPath: "infrastructure/observability/kube-prometheus-stack.values.yaml" }
          - { name: loki,                  chart: loki,                  repo: "https://grafana.github.io/helm-charts",          version: "6.x",   valuesPath: "infrastructure/observability/loki.values.yaml" }
          - { name: tempo,                 chart: tempo,                 repo: "https://grafana.github.io/helm-charts",          version: "1.10.x",valuesPath: "infrastructure/observability/tempo.values.yaml" }
          - { name: promtail,              chart: promtail,              repo: "https://grafana.github.io/helm-charts",          version: "6.x",   valuesPath: "infrastructure/observability/promtail.values.yaml" }

  template:
    metadata:
      name: '{{.name}}'
      namespace: argocd
    spec:
      project: default
      sources:
        - chart: '{{.chart}}'
          repoURL: '{{.repo}}'
          targetRevision: '{{.version}}'
          helm:
            valueFiles:
              - $values/{{.valuesPath}}
        - repoURL: https://github.com/sinhadeepak/adaptive_learning_platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
