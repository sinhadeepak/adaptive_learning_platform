# Flutter app (per ADR-0002). This is a Sprint 0 stub — replace by running `flutter create .`
# from this directory once Flutter SDK is installed on the engineer's laptop.
name: adaptive_learning_mobile
description: Adaptive Learning Platform — mobile app (iOS + Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  # Phase B3 — IGS real-time WebSocket subscriber (Flutter parity).
  web_socket_channel: ^3.0.0
  flutter_markdown: ^0.7.4
  flutter_math_fork: ^0.7.2
  image_picker: ^1.1.2
  # Sprint 8 F-5 — paywall WebView for Stripe Checkout. The Stripe-hosted
  # page redirects to /billing?status=success on completion; the screen
  # listens for that URL and pops back to native Flutter.
  webview_flutter: ^4.10.0
  alp_design_tokens:
    path: ../../packages/design-tokens-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Vidya v1 font assets. Binaries land in assets/fonts/ via
  # scripts/vidya/install-fonts.sh (gitignored). Family names match
  # VidyaFonts in packages/design-tokens-flutter/lib/src/vidya/tokens.dart:
  #   VidyaFonts.display = 'InstrumentSerif'
  #   VidyaFonts.ui      = 'Geist'
  #   VidyaFonts.mono    = 'GeistMono'
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
