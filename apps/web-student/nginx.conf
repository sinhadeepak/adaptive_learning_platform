server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (baseline — tightened per-surface in Sprint 3)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Hashed static assets — long cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Health probe (k8s + Docker healthcheck)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # API proxy. Each location uses the `set $upstream` + `rewrite … break` +
  # `proxy_pass $upstream` pattern. `set` keeps the hostname in a variable so
  # nginx re-resolves DNS via the Docker resolver (127.0.0.11) on every request
  # — without it nginx caches the IP at config-load time, and a backend
  # container restart leaves the proxy pointing at a stale (or worse, reused)
  # IP. The `rewrite` is required because `proxy_pass` with a variable does
  # NOT do the implicit `/api/v1/<svc>/` → `/<svc>/` URI rewrite that the
  # literal form does — we have to spell it out.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/v1/auth/ {
    set $upstream "http://auth:8000";
    rewrite ^/api/v1/auth/(.*)$ /auth/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/profile/ {
    set $upstream "http://user-profile:8000";
    rewrite ^/api/v1/profile/(.*)$ /profile/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/catalog/ {
    set $upstream "http://catalog:8000";
    rewrite ^/api/v1/catalog/(.*)$ /catalog/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/search/ {
    set $upstream "http://search:8000";
    rewrite ^/api/v1/search/(.*)$ /search/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/analytics/ {
    set $upstream "http://analytics:8000";
    rewrite ^/api/v1/analytics/(.*)$ /analytics/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/flags/ {
    set $upstream "http://institution:8000";
    rewrite ^/api/v1/flags/(.*)$ /flags/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/notifications/ {
    set $upstream "http://notification:8000";
    rewrite ^/api/v1/notifications/(.*)$ /notifications/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/quiz/ {
    set $upstream "http://quiz:8000";
    rewrite ^/api/v1/quiz/(.*)$ /quiz/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
