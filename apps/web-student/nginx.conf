server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (baseline — tightened per-surface in Sprint 3)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Hashed static assets — long cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Health probe (k8s + Docker healthcheck)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # API proxy — Sprint 2 demo wiring. Each prefix routes to the matching
  # host-side service (services run on host per docker-compose convention).
  # Sprint 3 replaces this in-app proxy with the real API gateway service.
  resolver 127.0.0.11 ipv6=off;

  location /api/v1/auth/ {
    proxy_pass http://auth:8000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/profile/ {
    proxy_pass http://user-profile:8000/profile/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/catalog/ {
    proxy_pass http://catalog:8000/catalog/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/search/ {
    proxy_pass http://search:8000/search/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/analytics/ {
    proxy_pass http://analytics:8000/analytics/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/flags/ {
    proxy_pass http://institution:8000/flags/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/notifications/ {
    proxy_pass http://notification:8000/notifications/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/quiz/ {
    proxy_pass http://quiz:8000/quiz/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
