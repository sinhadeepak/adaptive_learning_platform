server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (baseline — tightened per-surface in Sprint 3)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Hashed static assets — long cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Health probe (k8s + Docker healthcheck)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # API proxy — activated when gateway is reachable at the named container.
  # Left commented for Sprint 0; Sprint 1 gateway story wires this up.
  # location /api/ {
  #   proxy_pass http://gateway:8000/;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
