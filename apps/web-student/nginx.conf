server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (baseline — tightened per-surface in Sprint 3)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Hashed static assets — long cache
  # Seed-media files referenced by polymorphic question payloads
  # (DIAGRAM_HOTSPOT, DIAGRAM_LABEL, PICTORIAL_IDENTIFY). Real assets
  # have not been authored yet; serve a single placeholder SVG for
  # every request so the renderers have a valid image and the
  # click-hotspot mechanics still work.
  location /seed-media/ {
    try_files $uri /seed-media/_placeholder.svg =404;
    add_header Cache-Control "public, max-age=300";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Health probe (k8s + Docker healthcheck)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # API proxy.
  #
  # Route pattern explained:
  # - regex `~ ^/api/v1/<svc>(/.*)?$` so list endpoints (no trailing slash,
  #   e.g. `/api/v1/flags`) AND deep paths (`/api/v1/flags/<name>`) both
  #   match. The earlier `location /api/v1/<svc>/` prefix-form silently
  #   fell through to the SPA fallback for the bare list path, which broke
  #   client `list()` calls.
  # - `set $upstream` + `rewrite ... break` + `proxy_pass $upstream` keeps
  #   the hostname in a variable so nginx re-resolves DNS via the Docker
  #   resolver (127.0.0.11) on every request — without it nginx caches
  #   the IP at config-load time, and a backend container restart leaves
  #   the proxy pointing at a stale (or worse, reused) IP.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location ~ ^/api/v1/auth(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/auth(/.*)?$ /auth$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/profile(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/profile(/.*)?$ /profile$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/catalog(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/catalog(/.*)?$ /catalog$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/search(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/search(/.*)?$ /search$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/analytics(/.*)?$ {
    set $upstream "http://engagement:8000";
    rewrite ^/api/v1/analytics(/.*)?$ /analytics$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/flags(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/flags(/.*)?$ /flags$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/notifications(/.*)?$ {
    set $upstream "http://engagement:8000";
    rewrite ^/api/v1/notifications(/.*)?$ /notifications$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # F8a/F8b — Social (friends, clans, leaderboards) lives in engagement.
  # The frontend sends X-User-Id explicitly via social.fetch() because
  # the engagement service uses it as its identity trust boundary.
  location ~ ^/api/v1/social(/.*)?$ {
    set $upstream "http://engagement:8000";
    rewrite ^/api/v1/social(/.*)?$ /social$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-User-Id $http_x_user_id;
  }

  location ~ ^/api/v1/quiz(/.*)?$ {
    set $upstream "http://quiz:8000";
    rewrite ^/api/v1/quiz(/.*)?$ /quiz$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # F7 (ADR-0027) — Battle WebSocket gateway. Path `/battle/*` is
  # stripped here and forwarded to alp-battle. The WebSocket upgrade
  # requires the Upgrade/Connection headers and a long read timeout
  # so the connection stays open through quiet periods.
  location ~ ^/battle(/.*)?$ {
    set $upstream "http://battle:8000";
    rewrite ^/battle(/.*)?$ $1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
  location ~ ^/api/v1/doubts(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/doubts(/.*)?$ /doubts$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # Phase B3 — IGS HTTP + WebSocket. The WS handshake at
  # /api/v1/igs/stream needs the Upgrade/Connection headers + long
  # read timeout to stay open through quiet periods (heartbeat
  # cadence is 30s, server-side).
  location ~ ^/api/v1/igs(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/igs(/.*)?$ /igs$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Phase B2 — PCE (Probabilistic Curriculum Engine).
  location ~ ^/api/v1/pce(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/pce(/.*)?$ /pce$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # R-S2 — student-facing content references (Watch & Learn shelf
  # on TopicDetail + the inline shelf inside ExplainCard on
  # QuizResult). Without this block requests fall through to the
  # SPA fallback and the shelf renders the empty-state.
  location ~ ^/api/v1/content(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/content(/.*)?$ /content$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # P7 — Object-storage upload control plane. The actual file bytes
  # never traverse this proxy; the browser PUTs directly to MinIO
  # (localhost:39000) using the presigned URL returned here.
  location ~ ^/api/v1/uploads(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/uploads(/.*)?$ /uploads$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # Phase 6 routes — missions, plans, recovery, screening (alp-learning)
  location ~ ^/api/v1/missions(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/missions(/.*)?$ /missions$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/plans(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/plans(/.*)?$ /plans$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/recovery(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/recovery(/.*)?$ /recovery$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/screening(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/screening(/.*)?$ /screening$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  # Phase 6 reflection + commitments (alp-engagement)
  location ~ ^/api/v1/reflections(/.*)?$ {
    set $upstream "http://engagement:8000";
    rewrite ^/api/v1/reflections(/.*)?$ /reflections$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/commitments(/.*)?$ {
    set $upstream "http://engagement:8000";
    rewrite ^/api/v1/commitments(/.*)?$ /commitments$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/adaptive(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/adaptive(/.*)?$ /adaptive$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Tutor chat is SSE — nginx must not buffer or the user sees the whole
    # reply at once after a long pause instead of a streaming effect.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    chunked_transfer_encoding on;
  }

  location ~ ^/api/v1/marketplace(/.*)?$ {
    set $upstream "http://marketplace:8000";
    rewrite ^/api/v1/marketplace(/.*)?$ /marketplace$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # index.html must NOT be cached, or browsers keep using a stale copy
  # that points at long-since-replaced /assets/*.js bundle hashes —
  # which is exactly the "I rebuilt but still see the old UI" report.
  # The hashed assets themselves stay on the 1y immutable cache above.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    expires off;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
