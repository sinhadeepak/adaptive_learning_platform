<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Learning — Student</title>
  </head>
  <body>
    <!-- Pre-React theme + density bootstrap. Reads the user's preferences
         from localStorage (set by ThemeProvider in /src/lib/theme.tsx and
         DensityProvider in /src/lib/density.tsx) and applies data-theme
         and data-density to <html> before stylesheets paint, so the first
         paint matches both choices. Without this, a light-mode user sees
         a dark flash for ~50ms; without density, spacing/type/radius
         scalars would jump on hydrate. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('alp.theme') || 'system';
          var effective = t === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : t;
          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.style.colorScheme = effective;
        } catch (e) { /* localStorage blocked — stays on default :root (dark) */ }
        try {
          var d = localStorage.getItem('alp.density');
          if (d !== 'junior' && d !== 'aspirant' && d !== 'pro') d = 'aspirant';
          document.documentElement.setAttribute('data-density', d);
        } catch (e) { /* localStorage blocked — stays on baseline aspirant */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
