server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Admin surface — stricter defaults. CSP + IP allow-list tighten in Sprint 3.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # API proxy — admin needs Auth + Institution (flags) + Profile.
  #
  # Route pattern explained:
  # - regex `~ ^/api/v1/<svc>(/.*)?$` so BOTH the list endpoint
  #   (`/api/v1/flags`, no trailing slash) AND deep paths
  #   (`/api/v1/flags/<name>`) match. The earlier `location /api/v1/flags/`
  #   prefix-form silently fell through to index.html for the bare path,
  #   which broke `flags.list()` from the React client.
  # - `set $upstream` + `rewrite ... break` + `proxy_pass $upstream` keeps
  #   the hostname in a variable so nginx re-resolves DNS per request via
  #   the Docker resolver. See web-student/nginx.conf for the rationale.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location ~ ^/api/v1/auth(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/auth(/.*)?$ /auth$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/profile(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/profile(/.*)?$ /profile$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/flags(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/flags(/.*)?$ /flags$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/catalog(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/catalog(/.*)?$ /catalog$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
