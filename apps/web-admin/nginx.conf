server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Admin surface — stricter defaults. CSP + IP allow-list tighten in Sprint 3.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # API proxy — admin needs Auth + Institution (flags) + Profile.
  #
  # Route pattern explained:
  # - regex `~ ^/api/v1/<svc>(/.*)?$` so BOTH the list endpoint
  #   (`/api/v1/flags`, no trailing slash) AND deep paths
  #   (`/api/v1/flags/<name>`) match. The earlier `location /api/v1/flags/`
  #   prefix-form silently fell through to index.html for the bare path,
  #   which broke `flags.list()` from the React client.
  # - `set $upstream` + `rewrite ... break` + `proxy_pass $upstream` keeps
  #   the hostname in a variable so nginx re-resolves DNS per request via
  #   the Docker resolver. See web-student/nginx.conf for the rationale.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location ~ ^/api/v1/auth(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/auth(/.*)?$ /auth$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/profile(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/profile(/.*)?$ /profile$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/flags(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/flags(/.*)?$ /flags$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/v1/catalog(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/catalog(/.*)?$ /catalog$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # P7 — Admin AI-assisted exam builder. Two endpoints under
  # /admin/exam-builder/* (research, save). Long timeout because the
  # research call is a multi-second LLM round trip.
  location ~ ^/api/v1/admin(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/admin(/.*)?$ /admin$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Institution Core — tenants, cohorts, members, invites.
  location ~ ^/api/v1/institution(/.*)?$ {
    set $upstream "http://identity:8000";
    rewrite ^/api/v1/institution(/.*)?$ /institution$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # Phase 7 (P7-A1) — analytics drill + cohort + institution dashboards.
  location ~ ^/api/v1/analytics(/.*)?$ {
    set $upstream "http://engagement:8000";
    rewrite ^/api/v1/analytics(/.*)?$ /analytics$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  location ~ ^/api/v1/marketplace(/.*)?$ {
    set $upstream "http://marketplace:8000";
    rewrite ^/api/v1/marketplace(/.*)?$ /marketplace$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # Phase 5 (P5-S57 / CE-308) — Human Grader Application backend.
  # /grading/queue + /grading/responses/{id}/grade + /grading/calibration-set
  # power the Grader Queue page; /evaluation/calibration/* power the
  # calibration dashboard.
  location ~ ^/api/v1/grading(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/grading(/.*)?$ /grading$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/evaluation(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/evaluation(/.*)?$ /evaluation$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  # Phase 5 (P5-S45 / S48) — admin AI cost dashboard + translation analytics
  # + per-question translation review. Each maps to a different module
  # inside alp-learning so the routes have distinct prefixes (admin/
  # localisation/ content/) but the upstream is the same.
  location ~ ^/api/v1/admin(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/admin(/.*)?$ /admin$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/localisation(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/localisation(/.*)?$ /localisation$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }
  location ~ ^/api/v1/content(/.*)?$ {
    set $upstream "http://learning:8000";
    rewrite ^/api/v1/content(/.*)?$ /content$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
