<!doctype html>
<html lang="en" data-theme="light" data-persona="pro" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Learning — Super Admin</title>
    <link
      rel="preload"
      href="/fonts/vidya/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/vidya/InstrumentSerif-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Vidya admin defaults: pro persona (black ink accent), compact
         density (dense tables for ops work), light theme. Admins can
         flip theme via the future settings panel. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('alp.theme') || 'system';
          var effectiveTheme = t === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          d.setAttribute('data-theme', effectiveTheme);
          d.style.colorScheme = effectiveTheme;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
