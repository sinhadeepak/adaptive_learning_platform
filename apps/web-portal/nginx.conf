server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # API proxy — Sprint 3 portal needs Auth + Content + Catalog. The
  # `set $upstream` + `rewrite … break` + `proxy_pass $upstream` pattern keeps
  # the hostname in a variable so nginx re-resolves DNS per request via the
  # Docker resolver. Required because backend container restarts otherwise
  # leave us pointing at a stale IP. See web-student/nginx.conf for the
  # detailed rationale comment.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/v1/auth/ {
    set $upstream "http://auth:8000";
    rewrite ^/api/v1/auth/(.*)$ /auth/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/profile/ {
    set $upstream "http://user-profile:8000";
    rewrite ^/api/v1/profile/(.*)$ /profile/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/content/ {
    set $upstream "http://content:8000";
    rewrite ^/api/v1/content/(.*)$ /content/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/v1/catalog/ {
    set $upstream "http://catalog:8000";
    rewrite ^/api/v1/catalog/(.*)$ /catalog/$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
