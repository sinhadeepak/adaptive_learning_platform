<!doctype html>
<html lang="en" data-theme="light" data-persona="pro" data-density="regular">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Learning — Portal</title>
    <link
      rel="preload"
      href="/fonts/vidya/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/vidya/InstrumentSerif-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Vidya pre-React bootstrap (see web-student/index.html for the full
         contract). Portal defaults: pro persona (ink accent — business
         surface for teachers + authors), regular density, light theme.
         Author routes can switch persona at route level via a wrapper
         element setting data-persona="aspirant" or "lifelong". -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('alp.theme') || 'system';
          var effectiveTheme = t === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          d.setAttribute('data-theme', effectiveTheme);
          d.style.colorScheme = effectiveTheme;
        } catch (e) {}
        try {
          var p = localStorage.getItem('alp.persona');
          var validPersonas = { aspirant: 1, junior: 1, senior: 1, pro: 1, lifelong: 1 };
          if (validPersonas[p]) d.setAttribute('data-persona', p);
        } catch (e) {}
        try {
          var dn = localStorage.getItem('alp.density');
          var legacyToDensity = { junior: 'comfy', aspirant: 'regular', pro: 'compact' };
          if (legacyToDensity[dn]) dn = legacyToDensity[dn];
          if (dn === 'compact' || dn === 'regular' || dn === 'comfy') {
            d.setAttribute('data-density', dn);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
