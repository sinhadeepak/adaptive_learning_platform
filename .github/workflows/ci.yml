name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas of the monorepo changed — skip jobs for untouched stacks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'services/auth/**'
              - 'services/user-profile/**'
              - 'services/content/**'
              - 'services/catalog/**'
              - 'services/search/**'
              - 'services/analytics/**'
              - 'services/payment/**'
              - 'services/institution/**'
              - 'services/notification/**'
              - 'services/adaptive-engine/**'
              - 'ruff.toml'
            go:
              - 'services/quiz/**'
            web:
              - 'apps/web/**'
            mobile:
              - 'apps/mobile/**'
            infra:
              - 'infrastructure/**'
              - '.github/workflows/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - user-profile
          - content
          - catalog
          - search
          - analytics
          - payment
          - institution
          - notification
          - adaptive-engine
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.*"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Lint (ruff check + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src
        continue-on-error: true  # strict mode; promote to failing once each service's types stabilise
      - name: Test
        run: uv run pytest --tb=short

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/quiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/quiz/go.sum
      - run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Fmt check
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Test
        run: go test -race -count=1 ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.x"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  required:
    # Branch protection target — stays green when no relevant stack changed.
    runs-on: ubuntu-latest
    needs: [python, go, web, mobile]
    if: always()
    steps:
      - name: Gate
        run: |
          results='${{ toJson(needs) }}'
          echo "$results"
          for r in $(echo "$results" | jq -r '.[].result'); do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "A required job failed."; exit 1
            fi
          done
