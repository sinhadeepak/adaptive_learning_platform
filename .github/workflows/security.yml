name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # Weekly Monday 03:00 UTC

concurrency:
  group: sec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snyk:
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}  # skips in forks without secret
    strategy:
      fail-fast: false
      matrix:
        target:
          - { path: "services/auth",             type: "python" }
          - { path: "services/user-profile",     type: "python" }
          - { path: "services/content",          type: "python" }
          - { path: "services/catalog",          type: "python" }
          - { path: "services/search",           type: "python" }
          - { path: "services/analytics",        type: "python" }
          - { path: "services/payment",          type: "python" }
          - { path: "services/institution",      type: "python" }
          - { path: "services/notification",     type: "python" }
          - { path: "services/adaptive-engine",  type: "python" }
          - { path: "services/quiz",             type: "go" }
          - { path: "apps/web",                  type: "node" }
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk test (${{ matrix.target.path }})
        working-directory: ${{ matrix.target.path }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high || exit 1

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - user-profile
          - content
          - catalog
          - search
          - analytics
          - payment
          - institution
          - notification
          - adaptive-engine
          - quiz
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t alp/${{ matrix.service }}:ci services/${{ matrix.service }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: alp/${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
