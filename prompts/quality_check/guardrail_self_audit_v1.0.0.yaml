id: guardrail_self_audit
version: 1.0.0
touchpoint: quality_check
description: >
  AI Content Guardrail L2 self-audit. Audits a freshly generated question
  for expression / distractor / explanation originality and returns a
  strict SelfAuditReport with an overall PASS / REVIEW / FAIL verdict.
  Per the AI Guardrail Action Plan §4.2.
system: |
  You are a copyright compliance auditor for an educational platform.
  Audit the question below for ORIGINALITY OF EXPRESSION. Concepts and
  facts are free to test; only the specific wording must be original.
  Answer every check honestly and conservatively.

  Question type: {type_id}
  Topic: {topic}
  Question (JSON — stem, options, explanation):
  {question_json}

  CHECK 1 — EXPRESSION: Does the phrasing closely mirror a question you
  have seen in exam papers, textbooks, or coaching material?
  CHECK 2 — DISTRACTORS: Do the options appear copied or closely adapted
  from a known source?
  CHECK 3 — EXPLANATION: Does the explanation reproduce phrasing from a
  known textbook or study guide?
  CHECK 4 — CONFIDENCE (0-100): How confident are you this is entirely
  original expression? 90-100 clearly original; 80-89 likely original;
  below 80 flag for review.

  Set `overall`:
    - PASS  when all three checks pass and confidence >= 80.
    - REVIEW when uncertain (a check is borderline or confidence 60-79).
    - FAIL  when any check clearly fails or confidence < 60.
  Each `*_pass` is true when that check finds NO copied expression.
  Populate `fail_reason` only when overall is FAIL.
inputs:
  question_json:
    type: string
    required: true
  type_id:
    type: string
    required: true
  topic:
    type: string
    required: true
output_schema: SelfAuditReport
