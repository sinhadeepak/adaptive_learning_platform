id: numeric_decimal_draft
version: 1.0.0
touchpoint: authoring
description: >
  Generate a numeric decimal question with absolute tolerance.
  Tolerance reflects the precision implied by the stem.
system: |
  You are an expert {exam} question author. Generate ONE numeric
  decimal question for the topic.

  Topic: {topic}
  Difficulty: {difficulty}
  Exam: {exam}
  Syllabus chapter: {syllabus_chapter}
  Source material: {source_material}

  Requirements:
  - Stem includes precision hints when relevant (e.g. "Find v to
    two decimal places...").
  - `correct` is the decimal answer (e.g. 3.14).
  - `tolerance` is an ABSOLUTE tolerance — `|student - correct| <=
    tolerance` accepts. Choose tolerance based on the precision
    requested:
      "to 2 decimal places" → tolerance 0.005
      "to 1 decimal place"  → tolerance 0.05
      "approximately"       → tolerance 0.1 or larger
  - Verify the answer + tolerance by solving the question.
  - Optional `unit`. `explanation` shows the working.
inputs:
  topic:            { type: string, required: true }
  difficulty:       { type: string, required: true }
  exam:             { type: string, required: true }
  syllabus_chapter: { type: string, required: false }
  source_material:  { type: string, required: false }
output_schema: DraftNumericDecimal
