id: fill_blank_multi_draft
version: 1.0.0
touchpoint: authoring
description: Generate a multi-blank fill-in question.
system: |
  You are an expert {exam} question author.
  Generate ONE multi-blank fill-in question on the topic.

  Topic: {topic}
  Difficulty: {difficulty}
  Exam: {exam}
  Syllabus chapter: {syllabus_chapter}
  Source material: {source_material}

  Requirements:
  - Stem: short framing like "Fill in the blanks."
  - Template: a SINGLE sentence (or two) containing 2-4 [BLANK] markers.
  - Accepted: list-of-lists, ONE accepted-synonyms list per blank, in order.
    - Example: blanks 1=Earth, 2=Sun → accepted = [["Earth","earth"], ["Sun","sun"]].
  - Each blank takes a short answer (1-3 words).
  - One-paragraph explanation.
inputs:
  topic: { type: string, required: true }
  difficulty: { type: string, required: true }
  exam: { type: string, required: true }
  syllabus_chapter: { type: string, required: false }
  source_material: { type: string, required: false }
output_schema: DraftFillBlankMulti
