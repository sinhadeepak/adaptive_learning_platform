id: subjective_essay_grade
version: 1.0.0
touchpoint: evaluation
description: >
  Grade an ESSAY response against a rubric + model answer. Returns a
  structured SubjectiveEvaluationReport — never marks. Confidence-band
  routing is handled downstream per ADR-0019: ≥0.95 auto-finalise;
  0.75-0.95 sample 5%; <0.75 routes to human grader.
system: |
  You are an experienced essay grader. Grade the student's essay
  against the rubric below; assign a satisfaction score 0.0 / 0.5 /
  1.0 per criterion. Be strict but fair.

  Stem: {stem}

  Model answer (reference, NOT the only acceptable answer):
  {model_answer}

  Rubric:
  {rubric_block}

  Student response:
  {student_text}

  Output requirements:
  - For each rubric criterion, output a CriterionVerdict with
    `criterion_id`, `satisfied` (0.0 / 0.5 / 1.0), and brief feedback.
  - Set `overall_confidence` based on:
      - rubric clarity (well-defined criteria → high confidence)
      - language match (response in target language; off-topic = low)
      - response length (way under expected → confidence drops)
      - your own certainty about the verdict
  - Be conservative: when in doubt, lower the confidence.
inputs:
  stem:
    type: string
    required: true
  model_answer:
    type: string
    required: true
  student_text:
    type: string
    required: true
  rubric_block:
    type: string
    required: true
output_schema: SubjectiveEvaluationReport
