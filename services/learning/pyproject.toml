[project]
name = "learning"
version = "0.1.0"
description = "Learning service — catalog + content + doubts + search + adaptive (the learning-material core)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "nats-py>=2.9",
    "opensearch-py[async]>=2.7",
    "redis>=5.0",
    "openai>=1.50",  # P5-S38 — sole LLM provider per user direction 2026-04-30
    "pyjwt>=2.9",
    "sympy>=1.13",  # P5-S38 — FORMULA_INPUT symbolic equivalence
    "pyyaml>=6.0",  # P5-S38 — AI routing config + prompt template registry
    "prometheus-client>=0.20",  # P5-S38 — AI Gateway metrics (calls, latency, cost, tokens, cache)
    "python-multipart>=0.0.9",  # P5-S62 — multipart audio upload for Whisper transcription
    "boto3>=1.34",  # P7 — S3/MinIO presigned URLs for the /uploads routes
    "anthropic>=0.40",  # P7 — multi-provider AI (Ollama / OpenAI / Anthropic)
    "cryptography>=44.0",  # P7 — Fernet at-rest encryption for AI provider keys
    "alp-flags",
    "alp-telemetry",
    "alp-auth",
    "alp-srs",
    # Pillar A — Exam Intelligence System (Stream B Phase B1).
    # Shared statistical primitives. Brings scipy + numpy transitively
    # for the forecaster + ADP θ-estimator.
    "alp-stats",
]

[tool.uv.sources]
alp-flags = { path = "../../libs/python/alp_flags", editable = true }
alp-telemetry = { path = "../../libs/python/alp_telemetry", editable = true }
alp-auth = { path = "../../libs/python/alp_auth", editable = true }
alp-srs = { path = "../../libs/python/alp_srs", editable = true }
alp-stats = { path = "../../libs/python/alp_stats", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
