[project]
name = "doubts"
version = "0.1.0"
description = "Doubts service — persistent doubt threads + AI/expert/peer answers."
requires-python = ">=3.11,<3.12"
dependencies = [
    "alp-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doubts"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.per-file-ignores]
# JSON API contract uses camelCase by design — ignore N815 for schema models.
"src/doubts/schemas.py" = ["N815"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.uv.sources]
alp-telemetry = { path = "../../libs/python/alp_telemetry", editable = true }
