[project]
name = "adaptive_engine"
version = "0.1.0"
description = "Adaptive Engine — 3PL IRT model, gRPC API, readiness scoring."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "alp-flags",
    "alp-telemetry",
]

[tool.uv.sources]
alp-flags = { path = "../../libs/python/alp_flags" }
alp-telemetry = { path = "../../libs/python/alp_telemetry", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_engine"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
