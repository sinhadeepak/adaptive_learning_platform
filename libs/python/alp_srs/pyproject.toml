[project]
name = "alp-srs"
version = "0.1.0"
description = "ALP shared spaced-repetition scheduler — one canonical SM-2 core used by both the flashcard review state (learning) and the topic revision queue (engagement), so the two can never drift."
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alp_srs"]

[tool.ruff]
extend = "../../../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
