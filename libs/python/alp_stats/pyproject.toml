[project]
name = "alp-stats"
version = "0.1.0"
description = "ALP shared statistical primitives — Beta-Binomial, 3PL IRT, Thompson sampling, Kaplan-Meier survival, hierarchical Bayes. Powers EIS, PCE, ADP, IGS, and the non-response model. Per docs/02_planning/Platform_Analytics_Catalogue.md §17."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alp_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
