[project]
name = "alp-flags"
version = "0.1.0"
description = "ALP Python feature-flag SDK — HTTP fetch from Institution + in-memory TTL cache + NATS-driven invalidation + hardcoded fallback. ADR-0001 / FS-04."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "nats-py>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alp_flags"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
